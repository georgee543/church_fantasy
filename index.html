<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mar Girgis Church Fantasy League</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #38003c;
            --secondary-color: #00ff85;
            --accent-red: #e90052;
            --accent-blue: #04f5ff;
            --dark-bg: #110014;
            --card-bg: #240029;
            --text-light: #ffffff;
            --text-muted: #b0a0b3;
            --border-color: #4a0050;
            --pitch-green: #1f7a32;
            --pitch-line: rgba(255, 255, 255, 0.4);
            --gold: #ff1d30;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Header & Navbar */
        header {
            background: linear-gradient(135deg, var(--primary-color), #120015);
            border-bottom: 3px solid var(--secondary-color);
            padding: 15px 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            font-size: 2rem;
            color: var(--secondary-color);
            text-shadow: 0 0 10px var(--secondary-color);
        }

        .logo-text h1 {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--text-light);
            text-transform: uppercase;
        }

        .logo-text span {
            color: var(--secondary-color);
        }

        .user-status-bar {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
        }

        .nav-links {
            display: flex;
            gap: 10px;
            background: var(--card-bg);
            padding: 5px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow-x: auto;
            max-width: 100%;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px 18px;
            font-weight: 600;
            font-size: 0.9rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .nav-btn:hover {
            color: var(--text-light);
            background: rgba(255,255,255,0.05);
        }

        .nav-btn.active {
            background: var(--secondary-color);
            color: var(--primary-color);
            box-shadow: 0 0 15px rgba(0, 255, 133, 0.4);
        }

        /* Deadline Bar */
        .deadline-banner {
            background: linear-gradient(90deg, #120015, #38003c, #120015);
            border-bottom: 1px solid var(--border-color);
            padding: 8px 20px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent-blue);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .deadline-timer {
            background: var(--accent-red);
            color: #fff;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        /* Container Layout */
        .main-content {
            max-width: 1200px;
            margin: 25px auto;
            padding: 0 15px;
            width: 100%;
            flex: 1;
        }

        .tab-panel {
            display: none;
            animation: fadeIn 0.4s cubic-bezier(0.39, 0.575, 0.565, 1) both;
        }

        .tab-panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Auth Form Box */
        .auth-container {
            max-width: 420px;
            margin: 40px auto;
            background: var(--card-bg);
            padding: 35px 30px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            text-align: center;
        }

        .auth-container h2 {
            margin-bottom: 8px;
            color: var(--secondary-color);
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border 0.3s;
        }

        .form-input:focus {
            border-color: var(--secondary-color);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--secondary-color);
            color: var(--primary-color);
            font-weight: 700;
            font-size: 1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 255, 133, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 255, 133, 0.5);
        }

        .auth-toggle {
            margin-top: 18px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .auth-toggle span {
            color: var(--secondary-color);
            cursor: pointer;
            font-weight: 600;
            text-decoration: underline;
        }

        /* Squad Page Layout */
        .squad-layout {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 25px;
        }

        @media (max-width: 900px) {
            .squad-layout {
                grid-template-columns: 1fr;
            }
        }

        /* Football Pitch */
        .pitch-container {
            background: linear-gradient(180deg, #1b6329 0%, #154e20 100%);
            border-radius: 20px;
            padding: 20px 10px;
            position: relative;
            border: 4px solid #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            min-height: 520px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        .pitch-container::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--pitch-line);
            transform: translateY(-50%);
        }

        .pitch-container::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100px;
            height: 100px;
            border: 2px solid var(--pitch-line);
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo-section">
                <i class="fa-solid fa-trophy logo-icon"></i>
                <div class="logo-text">
                    <h1>Mar Girgis <span>Fantasy</span></h1>
                </div>
            </div>
            <div class="user-status-bar">
                <span id="userDisplay">Welcome!</span>
            </div>
        </div>
    </header>

    <div class="deadline-banner">
        <span>Gameweek 1 Deadline:</span>
        <span class="deadline-timer">Saturday, 18:00</span>
    </div>

    <main class="main-content">
        <!-- شاشة التسجيل الأولى -->
        <div class="auth-container" id="authBox">
            <h2>Mar Girgis Fantasy</h2>
            <p style="color: var(--text-muted); margin-bottom: 20px;">Welcome to Church League</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>Team Name</label>
                    <input type="text" id="teamNameInput" class="form-input" placeholder="Enter your team name" required>
                </div>
                <button type="submit" class="btn-primary">Enter League</button>
            </form>
            
            <div id="messageBox" style="margin-top: 15px; font-weight: 600;"></div>
        </div>

        <!-- واجهة اللعبة الأصلية (الملعب والمانجمنت) -->
        <div class="squad-layout" id="gameLayout" style="display: none;">
            <div class="pitch-container">
                <div style="text-align: center; z-index: 2; margin: auto;">
                    <h2 style="color: #fff; margin-bottom: 10px;"><i class="fa-solid fa-shield-halved"></i> تشكيلة فريقك أصبحت جاهزة!</h2>
                    <p style="color: var(--secondary-color); font-size: 1.1rem;">أهلاً بيك في دوري كنيسة مارجرجس للفانتسي ⚽🔥</p>
                </div>
            </div>
            <div style="background: var(--card-bg); padding: 20px; border-radius: 20px; border: 1px solid var(--border-color);">
                <h3 style="color: var(--secondary-color); margin-bottom: 15px;">إدارة الفريق (Management)</h3>
                <p style="color: var(--text-muted); font-size: 0.9rem;">تم حفظ اسم فريقك في قاعدة البيانات بنجاح وأنت جاهز للمنافسة.</p>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const teamName = document.getElementById('teamNameInput').value.trim();
            const messageBox = document.getElementById('messageBox');

            if(!teamName) return;

            messageBox.style.color = '#04f5ff';
            messageBox.innerText = 'Connecting to Server...';

            localStorage.setItem('teamName', teamName);
            document.getElementById('userDisplay').innerText = teamName;

            try {
                await fetch('/api/teams', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ teamName: teamName })
                });
            } catch (err) {
                console.log('Saved locally');
            }

            messageBox.style.color = '#00ff85';
            messageBox.innerText = 'Welcome ' + teamName + '! Entering Game...';

            setTimeout(() => {
                document.getElementById('authBox').style.display = 'none';
                document.getElementById('gameLayout').style.display = 'grid';
            }, 800);
        });
    </script>
</body>
</html>
