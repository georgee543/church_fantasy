<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mar Girgis Church Fantasy League</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #38003c;
            --secondary-color: #00ff85;
            --accent-red: #e90052;
            --accent-blue: #04f5ff;
            --dark-bg: #110014;
            --card-bg: #240029;
            --text-light: #ffffff;
            --text-muted: #b0a0b3;
            --border-color: #4a0050;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background: linear-gradient(135deg, var(--primary-color), #120015);
            border-bottom: 3px solid var(--secondary-color);
            padding: 15px 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            font-size: 2rem;
            color: var(--secondary-color);
        }

        .logo-text h1 {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-light);
            text-transform: uppercase;
        }

        .logo-text span {
            color: var(--secondary-color);
        }

        .user-status-bar {
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
        }

        .deadline-banner {
            background: linear-gradient(90deg, #120015, #38003c, #120015);
            border-bottom: 1px solid var(--border-color);
            padding: 8px 20px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--accent-blue);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        .deadline-timer {
            background: var(--accent-red);
            color: #fff;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 700;
        }

        .main-content {
            max-width: 1200px;
            margin: 25px auto;
            padding: 0 15px;
            width: 100%;
            flex: 1;
        }

        .auth-container {
            max-width: 420px;
            margin: 40px auto;
            background: var(--card-bg);
            padding: 35px 30px;
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            text-align: center;
        }

        .auth-container h2 {
            margin-bottom: 8px;
            color: var(--secondary-color);
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--secondary-color);
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: var(--secondary-color);
            color: var(--primary-color);
            font-weight: 700;
            font-size: 1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 255, 133, 0.5);
        }

        #messageBox {
            margin-top: 15px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* Squad / Game Layout (مخفية لحد ما تسجل) */
        .squad-layout {
            display: none;
            grid-template-columns: 1fr 340px;
            gap: 25px;
        }

        @media (max-width: 900px) {
            .squad-layout {
                grid-template-columns: 1fr;
            }
        }

        .pitch-container {
            background: linear-gradient(180deg, #1b6329 0%, #154e20 100%);
            border-radius: 20px;
            padding: 30px;
            border: 4px solid #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            min-height: 450px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .sidebar-panel {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <div class="logo-section">
                <i class="fa-solid fa-trophy logo-icon"></i>
                <div class="logo-text">
                    <h1>Mar Girgis <span>Fantasy</span></h1>
                </div>
            </div>
            <div class="user-status-bar">
                <span id="userDisplay">Welcome!</span>
            </div>
        </div>
    </header>

    <div class="deadline-banner">
        <span>Gameweek 1 Deadline:</span>
        <span class="deadline-timer">Saturday, 18:00</span>
    </div>

    <main class="main-content">
        <!-- شاشة تسجيل اسم الفريق -->
        <div class="auth-container">
            <h2>Mar Girgis Fantasy</h2>
            <p style="color: var(--text-muted); margin-bottom: 20px;">Welcome to Church League</p>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>Team Name</label>
                    <input type="text" id="teamNameInput" class="form-input" placeholder="Enter your team name" required>
                </div>
                <button type="submit" class="btn-primary">Enter League</button>
            </form>
            
            <div id="messageBox"></div>
        </div>

        <!-- شاشة اللعبة والملعب (هتظهر أوتوماتيك أول ما تدوس Enter) -->
        <div class="squad-layout">
            <div class="pitch-container">
                <h2 style="color: #fff; margin-bottom: 10px;"><i class="fa-solid fa-shield-halved"></i> تشكيلة فريقك جاهزة!</h2>
                <p style="color: var(--secondary-color); font-size: 1.1rem;">أهلاً بيك في دوري كنيسة مارجرجس للفانتسي ⚽🔥</p>
            </div>
            <div class="sidebar-panel">
                <h3 style="color: var(--secondary-color); margin-bottom: 15px;">معلومات الدوري</h3>
                <p style="color: var(--text-muted); font-size: 0.9rem;">تم حفظ اسم فريقك في الداتابيز بنجاح وأنت جاهز للمنافسة.</p>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const teamName = document.getElementById('teamNameInput').value.trim();
            const messageBox = document.getElementById('messageBox');

            if(!teamName) return;

            messageBox.style.color = '#04f5ff';
            messageBox.innerText = 'Connecting to Server...';

            // حفظ اسم الفريق
            localStorage.setItem('teamName', teamName);
            document.getElementById('userDisplay').innerText = teamName;

            try {
                await fetch('/api/teams', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ teamName: teamName })
                });
            } catch (err) {
                console.log('Saved locally');
            }

            messageBox.style.color = '#00ff85';
            messageBox.innerText = 'Welcome ' + teamName + '! Entering Game...';

            // إخفاء صفحة التسجيل وإظهار الملعب فوراً
            setTimeout(() => {
                document.querySelector('.auth-container').style.display = 'none';
                document.querySelector('.squad-layout').style.display = 'grid';
            }, 800);
        });
    </script>
</body>
</html>
